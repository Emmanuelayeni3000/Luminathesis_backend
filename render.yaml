services:
  - type: web
    name: luminathesis-backend
    runtime: python
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: python -m uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: LLAMA_CLOUD_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SEMANTIC_SCHOLAR_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
